[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localnetviewer-server"
version = "0.1.0"
description = "LocalNetViewer 局域网电子书阅读服务器（FastAPI + Pillow）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Pillow>=10.2",
    "charset-normalizer>=3.3",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pypdfium2>=4.30",
    "rarfile>=4.1",
    "py7zr>=0.21",
]

[project.optional-dependencies]
# 启动时列出网卡名称与类型（推荐安装，缺失时退化为纯标准库枚举）
sync = ["psutil>=5.9"]
# 书库目录变化监听（P4 可选）
watch = ["watchfiles>=0.21"]
# 控制台二维码（P4 可选）
qr = ["qrcode>=7.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.setuptools.package-data]
app = ["assets/fonts/*", "assets/fonts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
